[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # These Vite variables are intentionally compiled into the browser bundle.
  # WorkOS redirect URI values are public URLs used by the auth flow.
  # Keep real server secrets out of this allowlist.
  SECRETS_SCAN_OMIT_KEYS = "VITE_WORKOS_CLIENT_ID,VITE_WORKOS_REDIRECT_URI,VITE_SIGNATIS_AUTH_MODE,WORKOS_REDIRECT_URI,WORKOS_SIGN_OUT_REDIRECT_URI"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/login"
  to = "/.netlify/functions/login"
  status = 200

[[redirects]]
  from = "/callback"
  to = "/.netlify/functions/callback"
  status = 200

[[redirects]]
  from = "/logout"
  to = "/.netlify/functions/logout"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
