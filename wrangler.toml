# wrangler.toml configures the Cloudflare Workers with Assets deployment.
name = "re-ai"
main = "src/worker.ts"
compatibility_date = "2024-09-23"
compatibility_flags = [ "nodejs_compat" ]

# Non-secret environment variables.
# SECRETS (SCALEKIT_CLIENT_SECRET, SESSION_SECRET, CSRF_SECRET, TURSO_AUTH_TOKEN)
# must be set via `wrangler secret put <NAME>` — do NOT put them here.
[vars]
SCALEKIT_CLIENT_ID = "spac_130071553437073410"
SCALEKIT_ENV_URL = "https://swarty.scalekit.dev"
SCALEKIT_REDIRECT_URI = "https://re-ai.alansyahmi2004.workers.dev/callback"
SCALEKIT_SIGN_OUT_REDIRECT_URI = "https://re-ai.alansyahmi2004.workers.dev/?logout=true"
TURSO_DATABASE_URL = "libsql://signatis-alansyahmi.aws-ap-northeast-1.turso.io"

[assets]
directory = "./dist"
binding = "ASSETS"
